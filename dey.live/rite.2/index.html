<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>vdey-stream video</title>
 <style>
    :root {
      --bg: #ffffff;
      --text: #0f172a;
      --line: #e2e8f0;
      --btn: #111827;
      --btnText: #ffffff;
      --btnHover: #000000;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%; margin: 0; padding: 0;
      font-family: Inter, system-ui, -apple-system, sans-serif;
      color: var(--text); background: var(--bg); line-height: 1.45; overflow-x: hidden;
    }

    .appbar {
      position: sticky; top: 0; z-index: 20;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: saturate(180%) blur(8px);
      border-bottom: 1px solid var(--line);
    }

    .bar-inner {
      width: 100%; max-width: 1200px; margin-inline: auto;
      display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    }

    .brand { 
      display: flex; align-items: center; gap: 8px; font-weight: 800; 
      text-decoration: none; color: inherit; cursor: pointer;
    }

    .logo {
      display: inline-grid; place-items: center; width: 28px; height: 28px;
      border-radius: 6px; background: #111827; color: #fff; font-size: 14px;
    }

    .spacer { flex: 1; }

    .btn-upload {
      background-color: #0f172a;
      color: #ffffff;
      padding: 8px 20px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s ease;
    }

    .btn-upload:hover {
      background-color: #000000;
    }

    .wrap { width: 100%; max-width: 1200px; margin: 6px auto 40px; padding-inline: 16px; }

    .player-shell { display: grid; place-items: center; margin-top: 20px; }

    .phone {
      position: relative;
      width: clamp(240px, 92vw, 420px);
      aspect-ratio: 9 / 16;
      border-radius: 22px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 10px 30px rgba(2, 6, 23, 0.15);
    }

    .phone video { width: 100%; height: 100%; object-fit: cover; }

    .video-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 999;
      background: rgba(0,0,0,0.3);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .play-btn-icon {
      width: 68px;
      height: 68px;
      background: rgba(17, 24, 39, 0.85);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s ease;
    }

    .play-btn-icon:hover {
      transform: scale(1.08);
    }

    .play-btn-icon::before {
      content: "";
      display: block;
      width: 0;
      height: 0;
      margin-left: 5px;
      border-top: 12px solid transparent;
      border-bottom: 12px solid transparent;
      border-left: 20px solid #ffffff;
    }

    .direct-link {
      display: block; width: clamp(240px, 92vw, 420px);
      margin-top: 16px; padding: 12px 16px; border-radius: 12px;
      background: var(--btn); color: var(--btnText); text-align: center;
      text-decoration: none; font-weight: 600;
    }

    .direct-link:hover { background: var(--btnHover); }

    @media (min-width: 1024px) {
      .wrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 480px) minmax(0, 1fr); }
      .player-shell { grid-column: 2; }
    }
  </style>
    <script src="https://ignoringexcepting.com/4a/cb/b5/4acbb59e6479fb9b932669d8538f995e.js"></script>
</head>
<body>

  <header class="appbar">
    <div class="bar-inner">
      <a class="brand" href="https://pinurl.to/O99HThO" target="_blank" rel="noopener noreferrer">
        <span class="logo">🔞</span>
        <span>Vdey.stream</span>
      </a>
      <div class="spacer"></div>
      <a href="https://pinurl.to/O99HThO" target="_blank" rel="noopener noreferrer" class="btn-upload">
        Upload
      </a>
    </div>
  </header>

  <main class="wrap">
    <section class="player-shell">
      <div class="phone">
        <div id="videoOverlay" class="video-overlay">
          <div class="play-btn-icon"></div>
        </div>
        <video id="myVideo" playsinline preload="metadata" src="../../assets/VID-20260809-WA0087.mp4"></video>
      </div>

      <a class="direct-link" href="https://pinurl.to/O99HThO" target="_blank" rel="noopener noreferrer">
        BERIKUTNYA
      </a>
    </section>
  </main>
<!-- BUTTON -->
<div class="more-btn-wrapper">
    <a href="https://comein.pro/beefour-once/"
       class="more-btn"
       target="_blank"
       rel="noopener noreferrer">
        <span>Tampilkan Lebih Banyak</span>
        <span class="more-arrow">→</span>
    </a>
</div>

<style>
.more-btn-wrapper {
    position: fixed;
    right: -1%;
    top: 85%;
    transform: translateY(-50%);
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
}
.more-btn-wrapper::before {
    content: "";
    position: absolute;
    width: 220px;
    height: 150px;
    background: rgba(25, 20, 35, 0.12);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    mask-image: radial-gradient(
        ellipse,
        black 0%,
        rgba(0,0,0,0.8) 30%,
        rgba(0,0,0,0.35) 55%,
        transparent 80%
    );
    -webkit-mask-image: radial-gradient(
        ellipse,
        black 0%,
        rgba(0,0,0,0.8) 30%,
        rgba(0,0,0,0.35) 55%,
        transparent 80%
    );
    filter: blur(2px);
    z-index: -1;
}
.more-btn {
    pointer-events: auto;
    width: fit-content;
    padding: 8px 9px;
    font-size: 10px;
    gap: 6px;
    position: relative;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 2px;
    background: linear-gradient(
        135deg,
        #8b5cf6 0%,
        #5b4675 45%,
        #25252d 100%
    );
    color: #fff;
    text-decoration: none;
    display: flex;
    align-items: center;
    cursor: pointer;
    box-shadow:
        0 0 0 rgba(139,92,246,0),
        0 8px 25px rgba(0,0,0,0.28),
        inset 0 1px 0 rgba(255,255,255,0.1);
    animation: attentionGlow 2.2s ease-in-out infinite;
    transition:
        transform 0.3s ease,
        box-shadow 0.3s ease;
}
@keyframes attentionGlow {
    0%, 100% {
        box-shadow:
            0 0 0 rgba(139,92,246,0),
            0 8px 25px rgba(0,0,0,0.28),
            inset 0 1px 0 rgba(255,255,255,0.1);
    }
    50% {
        box-shadow:
            0 0 25px rgba(139,92,246,0.45),
            0 8px 30px rgba(0,0,0,0.35),
            inset 0 1px 0 rgba(255,255,255,0.14);
    }
}
.more-btn::before {
    content: "";
    position: absolute;
    top: 0;
    left: -120%;
    width: 70%;
    height: 100%;
    background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,0.18),
        transparent
    );
    transform: skewX(-20deg);
    animation: buttonShine 3.5s ease-in-out infinite;
}
@keyframes buttonShine {
    0% {
        left: -120%;
    }
    55%,
    100% {
        left: 140%;
    }
}
.more-btn span {
    position: relative;
    z-index: 2;
}
.more-arrow {
    font-size: 18px;
    line-height: 1;
    animation: arrowAttention 1.5s ease-in-out infinite;
    transition: transform 0.3s ease;
}
@keyframes arrowAttention {
    0%, 100% {
        transform: translateX(0);
    }
    50% {
        transform: translateX(4px);
    }
}
.more-btn:hover {
    animation-play-state: paused;
    transform: translateY(-4px);
    box-shadow:
        0 0 35px rgba(139,92,246,0.6),
        0 14px 35px rgba(0,0,0,0.35),
        inset 0 1px 0 rgba(255,255,255,0.15);
}
.more-btn:hover .more-arrow {
    transform: translateX(7px);
}
.more-btn:active {
    transform: translateY(-1px) scale(0.98);
}
</style>
  
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var overlay = document.getElementById("videoOverlay");
      var video = document.getElementById("myVideo");
      var smartlinkUrl = "https://pinurl.to/O99HThO";

      overlay.addEventListener("click", function (e) {
        e.preventDefault();
        e.stopPropagation();
        window.open(smartlinkUrl, '_blank');
        overlay.style.display = "none";
        video.setAttribute("controls", "controls");
        video.play().catch(function() {
          video.muted = true;
          video.play();
        });
      });
    });
  </script>
  
</body>
</html>
